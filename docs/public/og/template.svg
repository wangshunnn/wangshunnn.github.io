<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
>
  <defs>
    <radialGradient id="paper" cx="48%" cy="40%" r="82%">
      <stop offset="0" stop-color="#fffefa" />
      <stop offset="0.58" stop-color="#faf9f6" />
      <stop offset="1" stop-color="#ece8de" />
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.72"
        numOctaves="3"
        seed="12"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- A fixed paper surface keeps the card readable in every host theme. -->
  <rect width="1200" height="630" fill="url(#paper)" />
  <rect width="1200" height="630" fill="#5f5138" filter="url(#grain)" opacity="0.34" />

  <!-- Quiet editorial details borrowed from the blog index. -->
  <path d="M96 104H160" stroke="#7a6848" stroke-width="3" stroke-linecap="round" opacity="0.78" />
  <text
    x="96"
    y="84"
    fill="#4b402e"
    font-family="SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15"
    font-weight="600"
    letter-spacing="2.4"
  >SOON WANG</text>
  <text
    x="1104"
    y="230"
    fill="none"
    stroke="#7a6848"
    stroke-width="1.4"
    stroke-opacity="0.13"
    font-family="SFMono-Regular, Menlo, Consolas, monospace"
    font-size="112"
    font-weight="700"
    letter-spacing="-5"
    text-anchor="end"
  >{{watermark}}</text>

  <g fill="#353431" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, sans-serif" font-size="{{title_font_size}}" font-weight="600" letter-spacing="-1.2">
    <text x="96" y="300" dominant-baseline="central">{{title}}</text>
  </g>

  <path d="M96 505H1104" stroke="#353431" stroke-opacity="0.14" />

  <text
    x="96"
    y="564"
    fill="#6b6861"
    font-family="SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15"
    letter-spacing="0.7"
  >{{footer_note}}</text>

  <text
    x="1104"
    y="564"
    fill="#6b6861"
    font-family="SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15"
    font-style="italic"
    text-anchor="end"
  >soonwang.me</text>
</svg>
